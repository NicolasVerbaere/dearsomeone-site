<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect — Dear Someone</title>
  <meta name="description" content="Write to Marlène Mutwa and Dear Someone for letters, collaborations, press and speaking.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Homemade+Apple&family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/site.js" defer></script>
</head>
<body>
<main id="main">

  <section class="page-hero">
    <div class="wrap split">
      <div>
        <span class="eyebrow">Connect</span>
        <h1>Write back to me, <em>dear someone</em>.</h1>
        <p class="lead">Notes, stories, prayers or just hello. I read every letter, even when I can't answer them all.</p>
        <p><strong>Press &amp; collaborations:</strong> choose “Press / collaboration” below, or see the <a href="press.html">press page</a>.</p>
        <p class="rules" style="margin-top:1.6rem"><a href="https://www.instagram.com/juuust_angel/" target="_blank" rel="noopener">Instagram</a> · <a href="https://www.tiktok.com/@juuust_angel?lang=fr" target="_blank" rel="noopener">TikTok</a> · <a href="https://substack.com/@mixedbutnotconfused" target="_blank" rel="noopener">Substack</a></p>
      </div>
      <div class="letter reveal">
        <form class="js-form" data-list="contact" data-ok="Your letter is on its way. Thank you for writing.">
          <span class="script" style="font-size:1.4rem">Dear Marlène,</span>
          <div class="form-grid">
            <div><label for="c-name">My name is</label><input class="input" id="c-name" name="name" required autocomplete="name"></div>
            <div><label for="c-email">Write back to</label><input class="input" id="c-email" name="email" type="email" required autocomplete="email"></div>
            <div class="full"><label for="c-subject">I'm writing about</label>
              <select id="c-subject" name="subject">
                <option>Just saying hello</option>
                <option>The card game</option>
                <option>The book</option>
                <option>The podcast</option>
                <option>Press / collaboration</option>
                <option>Speaking</option>
              </select></div>
            <div class="full"><label for="c-msg">My letter</label><textarea id="c-msg" name="message" required></textarea></div>
          </div>
          <p style="margin-top:1.2rem"><button class="btn" type="submit">Send my letter</button></p>
        </form>
      </div>
    </div>
  </section>

  <div data-signup data-list="connect"></div>
</main>
</body>
</html>
